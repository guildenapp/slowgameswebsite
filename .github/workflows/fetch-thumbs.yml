# Utilitaire ponctuel : télécharge les thumbnails Roblox officiels
# et les commit dans public/games/. Déclenché manuellement, supprimable ensuite.
name: Fetch Roblox thumbnails

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official thumbnails from Roblox
        run: |
          set -e
          UIDS="7162721918,8592814161,7541166722"
          json=$(curl -sf "https://thumbnails.roblox.com/v1/games/multiget/thumbnails?universeIds=$UIDS&size=768x432&format=Png&countPerUniverse=1")
          st=$(echo "$json" | jq -r '.data[] | select(.universeId==7162721918) | .thumbnails[0].imageUrl')
          fs=$(echo "$json" | jq -r '.data[] | select(.universeId==8592814161) | .thumbnails[0].imageUrl')
          tg=$(echo "$json" | jq -r '.data[] | select(.universeId==7541166722) | .thumbnails[0].imageUrl')
          mkdir -p public/games
          curl -sf -o public/games/strawberry-tower.png "$st"
          curl -sf -o public/games/fat-and-skinny.png "$fs"
          curl -sf -o public/games/triangulate.png "$tg"
          ls -la public/games
      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/games/*.png
          git commit -m "Add official Roblox game thumbnails"
          git push
